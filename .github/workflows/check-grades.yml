name: Kastamonu ÜBYS Swiss Bot

on:
  # Otomatik 7/24 çalışma ve hafta içi 08:00 TR bildirimleri Render (--serve) üzerine taşındı.
  # GitHub Actions yalnızca isteğe bağlı manuel çalıştırma (workflow_dispatch) için tutulur.
  workflow_dispatch:
    inputs:
      mode:
        description: "Çalıştırma kipi"
        required: false
        type: choice
        default: once
        options:
          - once
          - test_all
          - attendance
          - transcript
          - gpa
          - schedule
          - exams
          - announcements
          - weather
          - dining
          - calendar
          - briefing
          - commands
          - force_daily
      test_notify:
        description: "Telegram'a test bildirimi gönder (once ile test_all çalıştırır; diğer kiplerde bildirimi açar)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ubys-grade-check
  cancel-in-progress: false

jobs:
  check-grades:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Kastamonu Swiss Bot'u çalıştır
        env:
          UBYS_USERNAME: ${{ secrets.UBYS_USERNAME || secrets.OGRENCI_NO }}
          UBYS_PASSWORD: ${{ secrets.UBYS_PASSWORD || secrets.SIFRE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          CALENDAR_FACULTY: ${{ vars.CALENDAR_FACULTY || secrets.BOLUM_TIPI }}
          ENABLE_GRADES: ${{ vars.ENABLE_GRADES }}
          ENABLE_DINING: ${{ vars.ENABLE_DINING }}
          ENABLE_CALENDAR: ${{ vars.ENABLE_CALENDAR }}
          ENABLE_ATTENDANCE: ${{ vars.ENABLE_ATTENDANCE }}
          ENABLE_TRANSCRIPT: ${{ vars.ENABLE_TRANSCRIPT }}
          ENABLE_CATALOG: ${{ vars.ENABLE_CATALOG }}
          UBYS_PROGRAM: ${{ vars.UBYS_PROGRAM }}
          MIDTERM_WEIGHT: ${{ vars.MIDTERM_WEIGHT }}
          FINAL_WEIGHT: ${{ vars.FINAL_WEIGHT }}
          FINAL_MIN_SCORE: ${{ vars.FINAL_MIN_SCORE }}
          COURSE_WEIGHTS: ${{ vars.COURSE_WEIGHTS }}
          SEMESTER_WEEKS: ${{ vars.SEMESTER_WEEKS }}
          THEORY_MIN_ATTENDANCE: ${{ vars.THEORY_MIN_ATTENDANCE }}
          PRACTICE_MIN_ATTENDANCE: ${{ vars.PRACTICE_MIN_ATTENDANCE }}
          COURSE_HOURS: ${{ vars.COURSE_HOURS }}
          CALENDAR_CATEGORIES: ${{ vars.CALENDAR_CATEGORIES }}
          CALENDAR_REMINDER_DAYS: ${{ vars.CALENDAR_REMINDER_DAYS }}
          CALENDAR_LOOKAHEAD_DAYS: ${{ vars.CALENDAR_LOOKAHEAD_DAYS }}
          CALENDAR_NOTIFY_HOUR: ${{ vars.CALENDAR_NOTIFY_HOUR }}
          CALENDAR_WEEKLY_SUMMARY: ${{ vars.CALENDAR_WEEKLY_SUMMARY }}
          CALENDAR_URL: ${{ vars.CALENDAR_URL }}
          SKS_URL: ${{ vars.SKS_URL }}
          DINING_SHEET_URL: ${{ vars.DINING_SHEET_URL }}
          DINING_NOTIFY_HOUR: ${{ vars.DINING_NOTIFY_HOUR }}
          ENABLE_WEATHER: ${{ vars.ENABLE_WEATHER }}
          WEATHER_LAT: ${{ vars.WEATHER_LAT }}
          WEATHER_LON: ${{ vars.WEATHER_LON }}
          WEATHER_LOCATION: ${{ vars.WEATHER_LOCATION }}
          ENABLE_ANNOUNCEMENTS: ${{ vars.ENABLE_ANNOUNCEMENTS }}
          ANNOUNCEMENT_URLS: ${{ vars.ANNOUNCEMENT_URLS }}
          ANNOUNCEMENT_KEYWORDS: ${{ vars.ANNOUNCEMENT_KEYWORDS }}
          ENABLE_SCHEDULE: ${{ vars.ENABLE_SCHEDULE }}
          ENABLE_EXAM_SCHEDULE: ${{ vars.ENABLE_EXAM_SCHEDULE }}
          SCHEDULE_NOTIFY_HOUR: ${{ vars.SCHEDULE_NOTIFY_HOUR }}
          EXAM_REMINDER_DAYS: ${{ vars.EXAM_REMINDER_DAYS }}
          ENABLE_MATERIALS: ${{ vars.ENABLE_MATERIALS }}
          ENABLE_WEEKLY_BRIEFING: ${{ vars.ENABLE_WEEKLY_BRIEFING }}
          WEEKLY_BRIEFING_HOUR: ${{ vars.WEEKLY_BRIEFING_HOUR }}
          ENABLE_COMMANDS: ${{ vars.ENABLE_COMMANDS }}
          ALL_SEMESTERS: ${{ vars.ALL_SEMESTERS }}
          UBYS_USER_GROUP_ID: ${{ vars.UBYS_USER_GROUP_ID }}
          NOTIFY_ON_FIRST_RUN: ${{ vars.NOTIFY_ON_FIRST_RUN }}
        run: |
          MODE="${{ inputs.mode }}"
          NOTIFY="${{ inputs.test_notify }}"
          if [ -z "$MODE" ]; then
            MODE="once"
          fi

          FLAG=""
          if [ "$NOTIFY" = "true" ]; then
            FLAG="--notify-test"
          fi

          if [ "$MODE" = "once" ] && [ "$NOTIFY" = "true" ]; then
            python -m src.main --test --notify-test
          elif [ "$MODE" = "test_all" ]; then
            python -m src.main --test $FLAG
          elif [ "$MODE" = "dining" ]; then
            python -m src.main --dining $FLAG
          elif [ "$MODE" = "calendar" ]; then
            python -m src.main --calendar $FLAG
          elif [ "$MODE" = "transcript" ]; then
            python -m src.main --transcript $FLAG
          elif [ "$MODE" = "attendance" ]; then
            python -m src.main --attendance $FLAG
          elif [ "$MODE" = "gpa" ]; then
            python -m src.main --gpa $FLAG
          elif [ "$MODE" = "schedule" ]; then
            python -m src.main --schedule $FLAG
          elif [ "$MODE" = "exams" ]; then
            python -m src.main --exams $FLAG
          elif [ "$MODE" = "announcements" ]; then
            python -m src.main --announcements $FLAG
          elif [ "$MODE" = "weather" ]; then
            python -m src.main --weather $FLAG
          elif [ "$MODE" = "briefing" ]; then
            python -m src.main --briefing $FLAG
          elif [ "$MODE" = "commands" ]; then
            python -m src.main --commands
          elif [ "$MODE" = "force_daily" ]; then
            python -m src.main --once --force-daily
          else
            python -m src.main --once
          fi
