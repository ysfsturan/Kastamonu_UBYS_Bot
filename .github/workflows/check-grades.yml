name: Kastamonu ÜBYS Swiss Bot

on:
  schedule:
    # UTC 05:00 - 22:59 arası her 15 dakikada bir (Türkiye saatiyle 08:00 - 01:59)
    # Public depolarda GitHub Actions dakikaları ücretsiz ve sınırsızdır.
    # 7/24 kontrol için: '*/15 * * * *'
    - cron: '*/15 5-22 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: "Çalıştırma kipi"
        required: false
        type: choice
        default: once
        options:
          - once
          - test_all
          - dining
          - calendar
          - transcript
          - attendance
          - force_daily
      test_notify:
        description: "Telegram'a test bildirimi gönder (once ile test_all çalıştırır; diğer kiplerde bildirimi açar)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ubys-grade-check
  cancel-in-progress: false

jobs:
  check-grades:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Kastamonu Swiss Bot'u çalıştır
        env:
          UBYS_USERNAME: ${{ secrets.UBYS_USERNAME || secrets.OGRENCI_NO }}
          UBYS_PASSWORD: ${{ secrets.UBYS_PASSWORD || secrets.SIFRE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          CALENDAR_FACULTY: ${{ vars.CALENDAR_FACULTY || secrets.BOLUM_TIPI }}
          ENABLE_GRADES: ${{ vars.ENABLE_GRADES }}
          ENABLE_DINING: ${{ vars.ENABLE_DINING }}
          ENABLE_CALENDAR: ${{ vars.ENABLE_CALENDAR }}
          ENABLE_ATTENDANCE: ${{ vars.ENABLE_ATTENDANCE }}
          ENABLE_TRANSCRIPT: ${{ vars.ENABLE_TRANSCRIPT }}
          ENABLE_CATALOG: ${{ vars.ENABLE_CATALOG }}
          UBYS_PROGRAM: ${{ vars.UBYS_PROGRAM }}
          MIDTERM_WEIGHT: ${{ vars.MIDTERM_WEIGHT }}
          FINAL_WEIGHT: ${{ vars.FINAL_WEIGHT }}
          FINAL_MIN_SCORE: ${{ vars.FINAL_MIN_SCORE }}
          COURSE_WEIGHTS: ${{ vars.COURSE_WEIGHTS }}
          SEMESTER_WEEKS: ${{ vars.SEMESTER_WEEKS }}
          THEORY_MIN_ATTENDANCE: ${{ vars.THEORY_MIN_ATTENDANCE }}
          PRACTICE_MIN_ATTENDANCE: ${{ vars.PRACTICE_MIN_ATTENDANCE }}
          COURSE_HOURS: ${{ vars.COURSE_HOURS }}
          CALENDAR_CATEGORIES: ${{ vars.CALENDAR_CATEGORIES }}
          CALENDAR_REMINDER_DAYS: ${{ vars.CALENDAR_REMINDER_DAYS }}
          DINING_NOTIFY_HOUR: ${{ vars.DINING_NOTIFY_HOUR }}
          ALL_SEMESTERS: ${{ vars.ALL_SEMESTERS }}
          UBYS_USER_GROUP_ID: ${{ vars.UBYS_USER_GROUP_ID }}
          NOTIFY_ON_FIRST_RUN: ${{ vars.NOTIFY_ON_FIRST_RUN }}
        run: |
          MODE="${{ inputs.mode }}"
          NOTIFY="${{ inputs.test_notify }}"
          if [ -z "$MODE" ]; then
            MODE="once"
          fi

          if [ "$MODE" = "once" ] && [ "$NOTIFY" = "true" ]; then
            python -m src.main --test --notify-test
          elif [ "$MODE" = "test_all" ]; then
            if [ "$NOTIFY" = "true" ]; then
              python -m src.main --test --notify-test
            else
              python -m src.main --test
            fi
          elif [ "$MODE" = "dining" ]; then
            if [ "$NOTIFY" = "true" ]; then
              python -m src.main --dining --notify-test
            else
              python -m src.main --dining
            fi
          elif [ "$MODE" = "calendar" ]; then
            if [ "$NOTIFY" = "true" ]; then
              python -m src.main --calendar --notify-test
            else
              python -m src.main --calendar
            fi
          elif [ "$MODE" = "transcript" ]; then
            if [ "$NOTIFY" = "true" ]; then
              python -m src.main --transcript --notify-test
            else
              python -m src.main --transcript
            fi
          elif [ "$MODE" = "attendance" ]; then
            if [ "$NOTIFY" = "true" ]; then
              python -m src.main --attendance --notify-test
            else
              python -m src.main --attendance
            fi
          elif [ "$MODE" = "force_daily" ]; then
            python -m src.main --once --force-daily
          else
            python -m src.main --once
          fi
